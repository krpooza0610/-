<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thai in Korea V2</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- 1. ตั้งค่าสีและรากฐาน (Theme Setup) --- */
:root {
--bg-dark: #0f0c29;
--bg-gradient: linear-gradient(180deg, #0f0c29 0%, #302b63 100%);
--primary: #6a11cb;
--accent: #ffd700;
--glass: rgba(255, 255, 255, 0.1);
--text-main: #ffffff;
--text-dim: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }
body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }

/* --- 2. ส่วนหัวแอป (Header) --- */
.main-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(15, 12, 41, 0.8); backdrop-filter: blur(10px); }
.logo-zone b { font-size: 20px; display: block; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-zone span { font-size: 11px; color: var(--text-dim); }

/* --- 3. หน้าจอหลัก (Home Content) --- */
.page { padding: 15px; display: none; }
.page.active { display: block; }
.welcome-box { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; text-align: center; }

/* --- 4. เมนูด้านล่าง (Floating Nav) --- */
.nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; height: 65px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; }
.nav-item { color: var(--text-dim); text-align: center; font-size: 10px; cursor: pointer; transition: 0.3s; }
.nav-item.active { color: var(--accent); }
.nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
.center-btn { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -35px; border: 5px solid var(--bg-dark); box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4); }
/* --- เอฟเฟกต์ออร่าสำหรับประโยคใต้ชื่อ --- */
.logo-zone b {
font-size: 24px; /* ขยายขนาดชื่อให้เด่น */
letter-spacing: 2px;
}

.aura-text {
display: block;
font-size: 10px;
font-weight: bold;
color: #fff;
text-transform: uppercase;
/* สร้างออร่าเรืองแสงด้วยการซ้อนเงาหลายชั้น */
text-shadow: 
0 0 5px #ffd700, 
0 0 10px #ffd700, 
0 0 20px #ff00de, 
0 0 40px #ff00de;
animation: aura-glow 2s infinite alternate; /* ให้มันกะพริบเบาๆ */
}

@keyframes aura-glow {
from { opacity: 0.8; filter: brightness(1); }
to { opacity: 1; filter: brightness(1.5); }
}
/* --- ตกแต่งหน้าแชทสด --- */
#chat-display {
display: flex;
flex-direction: column;
gap: 10px;
/* เพิ่มเงาให้ดูนูนออกมาจากพื้นหลัง */
box-shadow: inset 0 0 20px rgba(0,0,0,0.5); 
border: 1px solid rgba(255,255,255,0.05);
}

/* ตกแต่งกล่องข้อความแชท (ให้ดูเหมือนแอปดังๆ) */
.msg-bubble {
background: var(--glass);
padding: 10px 15px;
border-radius: 15px;
border-bottom-left-radius: 2px;
max-width: 85%;
align-self: flex-start;
font-size: 14px;
border: 1px solid rgba(255,255,255,0.1);
}

/* ปรับแต่งช่องกรอกข้อความให้เด่นขึ้น */
#chatInput {
background: rgba(255,255,255,0.1) !important;
border: 1px solid var(--primary) !important;
box-shadow: 0 0 10px rgba(106, 17, 203, 0.3);
}

/* ปรับแต่งปุ่มส่ง */
.send-btn {
background: var(--primary);
color: white;
border: none;
width: 45px;
height: 45px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
cursor: pointer;
}
</style>
</head>
<body>

<header class="main-header">
<div class="logo-zone">
    <b>MANBODTIP</b>
    <span class="aura-text">รวมทุกอย่างที่คนไทยในเกาหลีต้องการ</span>
    </div>
<div style="font-size: 20px;">🔔</div>
</header>

<div id="chat-page" class="page">
    <div class="welcome-box" style="text-align: left;">
    <h3 style="color: var(--accent);">ห้องแชท MANBODTIP</h3>
    <p style="font-size: 12px; opacity: 0.7;">คุยสดๆ กับคนไทยในเกาหลี</p>
    </div>

    <div id="chat-display" style="height: 50vh; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px;">
    <div style="color: var(--text-dim); text-align: center; margin-top: 20px;">กำลังเชื่อมต่อสัญญาณ...</div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
    <input type="text" id="chatInput" placeholder="พิมพ์ข้อความที่นี่..." style="flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid var(--glass); background: var(--glass); color: white; outline: none;">
    <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>
    </div> <div id="home-page" class="page active">
    <div class="welcome-box">
    <h2>ยินดีต้อนรับครับภู!</h2>
    <p style="font-size: 14px; color: var(--text-dim); margin-top: 10px;">นี่คือโครงสร้างใหม่ที่ชิดซ้ายและเป็นระเบียบที่สุด</p>
    </div>
    <div style="text-align: center; padding: 40px; opacity: 0.5;">
    <p>กำลังเตรียมโหลดข้อมูลจากระบบเดิม...</p>
    </div>
    </div>
    
<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('home-page', this)">🏠<br>หน้าหลัก</div>

    <div class="nav-item" onclick="showPage('chat-page', this)">💬<br>แชทสด</div>

    <div class="center-btn">+</div>
    <div class="nav-item">🔍<br>ค้นหา</div>
    <div class="nav-item">👤<br>โปรไฟล์</div>
    </nav>
    
<script>
    function showPage(pageId, element) {
    // 1. ซ่อนทุกหน้าที่มีคลาสชื่อ 'page'
    document.querySelectorAll('.page').forEach(p => {
    p.style.display = 'none';
    });

    // 2. โชว์เฉพาะหน้าที่เรากด (pageId)
    document.getElementById(pageId).style.display = 'block';

    // 3. เปลี่ยนสีไอคอนเมนูให้รู้ว่าตอนนี้อยู่หน้านี้
    document.querySelectorAll('.nav-item').forEach(nav => {
    nav.classList.remove('active');
    });
    element.classList.add('active');
    }
    // ฟังก์ชันส่งข้อความแบบจำลอง
    window.sendMessage = () => {
    const input = document.getElementById('chatInput');
    const display = document.getElementById('chat-display');

    if(input.value.trim() !== "") {
    // สร้างกล่องข้อความใหม่
    const newMsg = `<div class="msg-bubble">${input.value}</div>`;
    // เอาไปแปะในหน้าจอแสดงผล
    display.insertAdjacentHTML('beforeend', newMsg);
    // ล้างช่องพิมพ์
    input.value = "";
    // เลื่อนหน้าจอลงล่างสุด
    display.scrollTop = display.scrollHeight;
    }
    }
    </script>

</body>
</html>
